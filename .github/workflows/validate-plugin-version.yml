name: Validate Tested Up To Version

# Whether "Tested up to" is stale is a function of time, not of any commit, so
# this runs on a schedule rather than on push or pull_request. Keeping it out of
# ci.yml is deliberate too: that workflow's paths-ignore skips '**/*.txt', which
# would suppress the one check whose entire input is readme.txt.
#
# Two things to know about schedule-driven workflows:
#   - They only run on the default branch, so this file does nothing until it is
#     merged, and workflow_dispatch does not appear in the UI until then either.
#   - GitHub disables scheduled workflows in public repos after 60 days with no
#     repository activity, and emails the owner. On a quiet plugin repo this can
#     go dormant without anyone noticing.
on:
  schedule:
    # Mondays, 13:17 UTC. Off the hour on purpose — on-the-hour crons land in
    # GitHub's most congested window and get delayed or dropped under load.
    - cron: '17 13 * * 1'
  workflow_dispatch:

# The action pushes a branch and opens a draft PR when the version is behind.
permissions:
  contents: write
  pull-requests: write

jobs:
  validate-plugin-version:
    name: Validate Tested Up To Version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Validate plugin tested up to version
        uses: jazzsequence/action-validate-plugin-version@v2.0.3
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
